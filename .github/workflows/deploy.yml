name: Publicar Jupyter Book

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Jupyter Book
        run: pip install "jupyter-book<2.0"

      - name: Construir o site
        run: jupyter-book build .

      - name: Preparar arquivos para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: material/_build/html

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
